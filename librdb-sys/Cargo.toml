[package]
name = "librdb-sys"
version = "0.2.0+2.3.0"
links = "librdb"
repository = "https://github.com/funcpp/rust-librdb"
# Crate's own code is MIT; it vendors librdb (MIT) plus deps/redis sources under
# BSD-3-Clause (Redis core), BSD-2-Clause (lzf), and Zlib (crcspeed). sha256 is
# public-domain (no SPDX obligation). File headers are retained for attribution.
license = "MIT AND BSD-3-Clause AND BSD-2-Clause AND Zlib"
description = "Native bindings to the librdb library"
keywords = ["redis"]
categories = ["external-ffi-bindings"]
edition = "2024"
rust-version = "1.94"
include = [
    "src/**/*",
    "build.rs",
    "wrapper.h",
    "librdb/api/**/*",
    "librdb/src/lib/**/*",
    "librdb/src/ext/extCommon.*",
    "librdb/src/ext/handlersFilter.c",
    "librdb/src/ext/handlersToJson.c",
    "librdb/src/ext/handlersToPrint.c",
    "librdb/src/ext/handlersToResp.c",
    "librdb/src/ext/readerFile.c",
    "librdb/src/ext/readerFileDesc.c",
    "librdb/src/version.h",
    "librdb/src/redisver.h",
    "librdb/deps/redis/**/*",
    "librdb/LICENSE",
]

[features]
default = []
dynamic-linking = []
static-linking = []

[build-dependencies]
cc = "1"
